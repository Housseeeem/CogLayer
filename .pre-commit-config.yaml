repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-worktree
        name: gitleaks-worktree (scan working tree including untracked files)
        entry: gitleaks detect --no-git --verbose --redact
        stages: [manual]
        always_run: true
        pass_filenames: false
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks-history (scan git history)
        entry: gitleaks detect --verbose --redact
        stages: [manual]
        always_run: true
        pass_filenames: false
